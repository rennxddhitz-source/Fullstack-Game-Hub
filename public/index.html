<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini .IO Game</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; color: #fff; }
  canvas { display: block; background: #1a1a1a; }
  #scoreBoard { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; font-size: 16px; pointer-events: none; }
  #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
  button { padding: 12px 30px; font-size: 18px; background: #0ff; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<div id="startScreen">
  <h1>Mini .IO Game</h1>
  <button id="joinBtn">Play Game</button>
</div>
<div id="scoreBoard">Score: <span id="score">0</span></div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

let myId = null;
let myData = null;
let players = {};
let foodList = [];
let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }
}, { passive: true });

document.getElementById('joinBtn').addEventListener('click', async () => {
  let res = await fetch('/api/join', { method: 'POST' });
  let data = await res.json();
  myId = data.id;
  myData = data.player;
  document.getElementById('startScreen').style.display = 'none';
  startGameLoop();
});

window.addEventListener('beforeunload', () => {
  if (myId) {
    navigator.sendBeacon('/api/leave', JSON.stringify({ id: myId }));
  }
});

async function fetchState() {
  try {
    let res = await fetch('/api/state');
    let data = await res.json();
    players = data.players;
    foodList = data.food;
  } catch(e) {}
}

async function sendPosition() {
  if (!myData) return;
  try {
    let res = await fetch('/api/move', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(myData)
    });
    let data = await res.json();
    foodList = data.food;
  } catch(e) {}
}

function startGameLoop() {
  setInterval(fetchState, 50);
  setInterval(sendPosition, 50);

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (myData && players[myId]) {
      myData = players[myId];
      
      let angle = Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);
      let speed = 3;
      myData.x += Math.cos(angle) * speed;
      myData.y += Math.sin(angle) * speed;

      myData.x = Math.max(myData.radius, Math.min(2000 - myData.radius, myData.x));
      myData.y = Math.max(myData.radius, Math.min(2000 - myData.radius, myData.y));

      ctx.save();
      ctx.translate(canvas.width / 2 - myData.x, canvas.height / 2 - myData.y);

      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      for (let x = 0; x <= 2000; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 2000); ctx.stroke();
      }
      for (let y = 0; y <= 2000; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(2000, y); ctx.stroke();
      }

      foodList.forEach(f => {
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(f.x, f.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      for (let id in players) {
        let p = players[id];
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name + ` (${p.score})`, p.x, p.y - p.radius - 8);
      }

      ctx.restore();

      document.getElementById('score').innerText = myData.score;
    }

    requestAnimationFrame(loop);
  }

  loop();
}
</script>
</body>
</html>
